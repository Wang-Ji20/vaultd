# Copy to the default location (see docs/user-manual.md) and adapt.

[server]
listen = "127.0.0.1:8765"             # must be a loopback address

[vault]
path = "/home/me/Obsidian/MainVault"
writable_folders = ["AI", "Inbox"]    # relative to the vault root
ignore = [".obsidian", ".trash", ".git"]
memory_file = "AI/memory.md"
git_autocommit = true                 # commit each write if the vault is a git repo

[admin]
password_hash = ""                    # set with `vaultd hash-password`
session_ttl = "12h"
theme = "system"                      # system, light or dark

[audit]
max_size_mb = 10
max_files = 5
log_arguments = true                  # if false, log only tool names and sizes

# One entry per app. Create these with `vaultd token new <app-name>`.
# [[apps]]
# name = "claude-desktop"
# token_sha256 = "..."

